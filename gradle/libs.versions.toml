[versions]
agp = "9.3.2"
kotlin = "2.4.10"
compose = "1.11.1"
composeBom = "2026.09.00"
icons = "1.7.8"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.9.4"
navigation = "2.8.5"
datastore = "1.1.0"
coroutines = "1.9.0"
material3 = "1.3.0"
materialColorUtilities = "4.1.1"
koin = "4.2.2"
dexlib2 = "2.5.2"
baksmali = "2.5.2"
smali = "2.5.2"
apksig = "8.7.3"
bouncycastle = "1.78.1"
jadx = "1.5.1"
slf4j = "2.0.16"
xerces = "2.12.2"
shizuku = "13.1.5"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "icons" }

material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialColorUtilities" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# 反编译引擎（P6）
dexlib2 = { module = "org.smali:dexlib2", version.ref = "dexlib2" }
baksmali = { module = "org.smali:baksmali", version.ref = "baksmali" }
# smali 汇编器：把改过的 smali 目录回编译成 dex（重打包闭环的关键）
smali = { module = "org.smali:smali", version.ref = "smali" }
# APK Signature Scheme v2/v3 签名（Android 11+ 对 targetSdk>=30 强制要求 v2）
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
# 生成自签名证书链，用于重打包后的签名
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
jadx-core = { module = "io.github.skylot:jadx-core", version.ref = "jadx" }
# jadx 1.5 把 dex/apk 输入拆成独立插件，缺它 load() 只会加载到 0 个类（只剩资源生成的 R.java）
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# jadx 内部使用 Apache XML 特性，Android 自带 JAXP 不支持，需要自带 Xerces
xerces-impl = { module = "xerces:xercesImpl", version.ref = "xerces" }

# JetBrains Compose 坐标（Android 目标下会重定向到 androidx.compose）
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose" }

# 高权限后端（P1）：Shizuku 的 binder 通道
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose" }
