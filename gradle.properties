# 本工程主要在 Android 设备上的 Debian(PRoot) 环境里构建，参数针对该环境调优
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1280m
# 设备内存紧张：Kotlin 编译器跑在 Gradle 进程内，避免第二个 JVM 被 LMK 杀掉
kotlin.compiler.execution.strategy=daemon

# Google 未发布 linux-aarch64 的 aapt2，设备侧用 qemu-user 包装 x86_64 aapt2。
# 换机器构建时删除下面两行即可回退到 Maven 官方 aapt2。
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
